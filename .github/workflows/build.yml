在工作流末尾的产物检查中加上这一段，可以直接在 GitHub Actions 运行日志里把生成的 APK 包名打印出来进行核验：

```yaml
      - name: 筛选并现场打印检验 APK 真实包名与版本
        run: |
          RAW_NAME="${{ github.event.inputs.app_version_name }}"
          VER_NAME="${RAW_NAME#v}"
          mkdir -p release_apk
          find app/build/outputs/apk/cn/release/ -type f -name "*.apk" -exec cp -v {} release_apk/JinCheng-Software-${VER_NAME}.apk \; || true

          if [ ! -f release_apk/*.apk ]; then
            find app/build/ -type f -name "*cn*release*.apk" ! -name "*unsigned*" -exec cp -v {} release_apk/JinCheng-Software-${VER_NAME}.apk \;
          fi

          ls -lh release_apk/

          echo "==================== AAPT 包名严格核验 ===================="
          AAPT_BIN=$(find /usr/local/lib/android/sdk/build-tools/ -name aapt | sort -V | tail -n 1)
          if [ -n "$AAPT_BIN" ]; then
            $AAPT_BIN dump badging release_apk/*.apk | grep -E "package: name=|application-label:"
          fi
          echo "=========================================================="
