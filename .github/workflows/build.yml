- name: 彻底击穿替换 flavors.gradle、清单与多语言(包名锁定 note.zjc.kim)
        run: |
          echo "1. 彻底替换 flavors.gradle 中的渠道专属包名（核心根源修复）..."
          find . -name "flavors.gradle" -exec sed -i -E 's/applicationId\s+["'"'"'][^"'"'"']+["'"'"']/applicationId "note.zjc.kim"/g' {} + || true

          echo "2. 修改 app/build.gradle 中的 applicationId 与 package..."
          if grep -q "applicationId" app/build.gradle; then
            sed -i -E 's/applicationId\s+["'"'"'][^"'"'"']+["'"'"']/applicationId "note.zjc.kim"/g' app/build.gradle
          else
            # 若 defaultConfig 内无声明，直接插入新行锁定包名
            sed -i '/defaultConfig\s*{/a \        applicationId "note.zjc.kim"' app/build.gradle
          fi

          echo "3. 替换全局所有 values 语言包中的应用名称与包名字符串..."
          find app/src/main/res/ -name "strings.xml" -exec sed -i -E 's/<string name="app_name">.*<\/string>/<string name="app_name">金成软件<\/string>/g' {} +
          find app/src/main/res/ -name "strings.xml" -exec sed -i -E 's/<string name="app_package_name">.*<\/string>/<string name="app_package_name">note.zjc.kim<\/string>/g' {} +

          echo "4. 同步 shortcuts.xml 快捷方式目标包名为 note.zjc.kim..."
          find app/src/main/res/ -name "shortcuts*.xml" -exec sed -i 's/targetPackage="[^"]*"/targetPackage="note.zjc.kim"/g' {} + || true
          find app/src/main/res/ -name "shortcuts*.xml" -exec sed -i 's/org.b3log.siyuan/note.zjc.kim/g' {} + || true

          echo "=== 检查 flavors.gradle 替换后的包名配置 ==="
          cat flavors.gradle | grep -C 2 "applicationId" || true
