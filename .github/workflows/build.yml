          mkdir -p app
          cp -f zjc.kim.jks app/zjc.kim.jks

          # 3. 写入 signings.gradle，采用 rootProject.file 锁定
          cat << 'EOF' > signings.gradle
          android {
              signingConfigs {
                  siyuanConfig {
                      storeFile rootProject.file("zjc.kim.jks")
                      storePassword "123456"
                      keyAlias "zjc.kim"
                      keyPassword "123456"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
          }
          EOF
          echo "永久固定签名证书还原配置就绪！"

      - name: 赋予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 执行正式版打包任务 (正式 Release)
        run: ./gradlew clean assembleCnRelease --stacktrace

      - name: 筛选并验证最终的已签名 APK 产物
        run: |
          RAW_NAME="${{ github.event.inputs.app_version_name }}"
          VER_NAME="${RAW_NAME#v}"
          mkdir -p release_apk
          echo "正在查找正式 release apk..."
          find app/build/outputs/apk/cn/release/ -type f -name "*.apk" -exec cp -v {} release_apk/JinCheng-Note-${VER_NAME}.apk \; || true

          if [ ! -f release_apk/*.apk ]; then
            find app/build/ -type f -name "*cn*release*.apk" ! -name "*unsigned*" -exec cp -v {} release_apk/JinCheng-Note-${VER_NAME}.apk \;
          fi

          ls -lh release_apk/

      - name: 上传打包好的 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: JinCheng-Note-${{ github.event.inputs.app_version_name }}
          path: release_apk/*.apk
